name: CI

on:
  push:
    branches:
      - main
      - 'security/**'
      - 'rc/**'
      - 'work/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Node 22 exposes node:sqlite behind this flag on older 22.x releases; newer
      # releases accept it as a no-op. The engine itself also starts with this flag.
      NODE_OPTIONS: --experimental-sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm --version

      - name: Install root dependencies (lockfile)
        run: npm ci

      - name: Install player dependencies (lockfile)
        run: pnpm --dir player install --frozen-lockfile

      - name: TypeScript check
        run: npm run typecheck

      - name: Theme token + ESLint
        run: npm run lint

      - name: Security, OAuth and SSRF regression tests
        run: npm run test:security

      - name: Auth compatibility suite
        run: npm run test:auth

      - name: Gateway protocol and cover regressions
        run: |
          npm run test:gateway
          npm run test:cover

      - name: Backend beta security, runtime, recommendation and recovery regressions
        run: npm run test:beta

      - name: Local engine and degradation suite
        run: npm run test:engine

      - name: Recommendation and smart-search tests
        run: npm run test:recommend

      - name: Observability and alerting self-check
        run: npm run test:observability

      - name: Player unit tests
        run: pnpm --dir player test

      - name: Frontend + asset build
        run: npm run build

      - name: Verify complete release inputs and package
        run: |
          node scripts/release-inputs.mjs --verify dist/release.json
          node scripts/package-release.mjs

      - name: Verify staged Pages tree and release identity
        run: npm run verify:pages-deploy

      - name: Isolated mixed workload and local alert delivery
        run: |
          npm run build:engine
          npm run test:load

      - name: Root production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Player production dependency audit
        run: pnpm --dir player audit --prod --audit-level=high

      - name: Generate CycloneDX dependency inventory
        run: npm run sbom

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: sonic-dist
          path: |
            dist
            reports/sbom
          retention-days: 7

  docker:
    name: Docker build and runtime smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v3

      - name: Prepare immutable release metadata
        env:
          SONIC_RELEASE_COMMIT: ${{ github.sha }}
          SONIC_RELEASE_ID: ${{ github.sha }}
          SONIC_RELEASE_DIRTY: '0'
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          node scripts/write-release-manifest.mjs --output dist/release.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('dist/release.json', 'utf8'));
          for (const [name, value] of Object.entries({ SONIC_RELEASE_COMMIT: manifest.baseCommit, SONIC_BUILD_TIME: manifest.buildTime, SONIC_RELEASE_ID: manifest.releaseId, SONIC_SOURCE_DIGEST: manifest.sourceDigest, SONIC_RELEASE_DIRTY: String(manifest.dirty) })) {
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          NODE

      - name: Build image from a clean checkout
        run: |
          node scripts/release-inputs.mjs --verify dist/release.json
          docker build -t sonic-ci:${{ github.sha }} \
            --build-arg SONIC_RELEASE_COMMIT="$SONIC_RELEASE_COMMIT" \
            --build-arg SONIC_BUILD_TIME="$SONIC_BUILD_TIME" \
            --build-arg SONIC_RELEASE_ID="$SONIC_RELEASE_ID" \
            --build-arg SONIC_SOURCE_DIGEST="$SONIC_SOURCE_DIGEST" \
            --build-arg SONIC_RELEASE_DIRTY="$SONIC_RELEASE_DIRTY" .

      - name: Verify OCI metadata matches the release manifest
        run: |
          docker image inspect sonic-ci:${{ github.sha }} > /tmp/sonic-image.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const m = JSON.parse(fs.readFileSync('dist/release.json', 'utf8'));
          const labels = JSON.parse(fs.readFileSync('/tmp/sonic-image.json', 'utf8'))[0].Config.Labels;
          assert.equal(labels['org.opencontainers.image.revision'], m.baseCommit);
          assert.equal(labels['org.opencontainers.image.created'], m.buildTime);
          assert.equal(labels['tech.epocanvas.sonic.release-id'], m.releaseId);
          assert.equal(labels['tech.epocanvas.sonic.source-digest'], m.sourceDigest);
          assert.equal(labels['tech.epocanvas.sonic.dirty'], String(m.dirty));
          NODE

      - name: Run container and verify auth-gated health endpoint
        env:
          ENGINE_SECRET: ci_engine_secret_at_least_32_characters_long
          AUTH_SECRET: ci_auth_secret_at_least_32_characters_long_ok
          IDENTITY_SECRET: ci_identity_secret_at_least_32_characters_long_ok
        run: |
          set -euo pipefail
          cleanup() { docker rm -f sonic-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # The project owner directly authorized the commercial/community
          # sources; smoke-test the production profile end to end.
          docker run -d --name sonic-ci --stop-timeout 75 \
            -e SONIC_ENGINE_SECRET="$ENGINE_SECRET" \
            -e SONIC_SECRET="$AUTH_SECRET" \
            -e SONIC_ENGINE_IDENTITY_SECRET="$IDENTITY_SECRET" \
            -e SONIC_RUNTIME=linux-engine \
            -e SONIC_ENV=production \
            -e SONIC_REQUIRE_RELEASE_METADATA=1 \
            -e SONIC_CONTENT_POLICY=strict-allowlist \
            -e SONIC_ALLOWED_SOURCES=netease,qq,kugou,kuwo,amll,lrclib \
            -p 18080:8080 \
            sonic-ci:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null \
              -H "X-Sonic-Engine-Key: $ENGINE_SECRET" \
              http://127.0.0.1:18080/api/sonic/engine/health; then
              break
            fi
            sleep 1
          done
          curl -fsS -D /tmp/sonic-health.headers -o /tmp/sonic-health.json \
            -H "X-Sonic-Engine-Key: $ENGINE_SECRET" \
            http://127.0.0.1:18080/api/sonic/engine/health
          curl -fsS http://127.0.0.1:18080/release.json > /tmp/sonic-frontend-release.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const expected = JSON.parse(fs.readFileSync('dist/release.json', 'utf8'));
          const frontend = JSON.parse(fs.readFileSync('/tmp/sonic-frontend-release.json', 'utf8'));
          const health = JSON.parse(fs.readFileSync('/tmp/sonic-health.json', 'utf8'));
          assert.equal(health.ok, true);
          assert.equal(health.release.releaseCommit, expected.baseCommit);
          for (const name of ['releaseId', 'sourceDigest', 'buildTime', 'dirty']) assert.equal(health.release[name], expected[name]);
          assert.deepEqual(frontend, expected);
          assert.match(fs.readFileSync('/tmp/sonic-health.headers', 'utf8').toLowerCase(), `x-sonic-release: ${expected.releaseId.toLowerCase()}`);
          NODE
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/sonic/engine/health)
          test "$status" = "401"
          docker stop --time 75 sonic-ci >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' sonic-ci)" = "0"
          docker logs sonic-ci

      - name: Verify backup, offline recovery and data persistence across graceful container recreation
        env:
          ENGINE_SECRET: ci_engine_secret_at_least_32_characters_long
          AUTH_SECRET: ci_auth_secret_at_least_32_characters_long_ok
          IDENTITY_SECRET: ci_identity_secret_at_least_32_characters_long_ok
        run: |
          set -euo pipefail
          NAME="sonic-ci-persist"
          VOLUME="sonic-ci-data-${{ github.run_id }}"
          cleanup() {
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            docker volume rm "$VOLUME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_ready() {
            for i in $(seq 1 30); do
              if curl -fsS -o /tmp/sonic-health.json \
                -H "X-Sonic-Engine-Key: $ENGINE_SECRET" \
                http://127.0.0.1:18081/api/sonic/engine/health \
                && grep -q '"ok":true' /tmp/sonic-health.json; then
                return 0
              fi
              sleep 1
            done
            docker logs "$NAME" || true
            return 1
          }

          docker volume create "$VOLUME" >/dev/null
          docker run -d --name "$NAME" --stop-timeout 75 \
            -e SONIC_ENGINE_SECRET="$ENGINE_SECRET" \
            -e SONIC_SECRET="$AUTH_SECRET" \
            -e SONIC_ENGINE_IDENTITY_SECRET="$IDENTITY_SECRET" \
            -e SONIC_RUNTIME=linux-engine \
            -e SONIC_ENV=production \
            -e SONIC_REQUIRE_RELEASE_METADATA=1 \
            -e SONIC_CONTENT_POLICY=strict-allowlist \
            -e SONIC_ALLOWED_SOURCES=netease,qq,kugou,kuwo,amll,lrclib \
            -v "$VOLUME":/app/data \
            -p 18081:8080 \
            sonic-ci:${{ github.sha }}
          wait_ready
          grep -q '"storageKind":"sqlite"' /tmp/sonic-health.json

          node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto';
          import assert from 'node:assert/strict';
          const now = Math.floor(Date.now() / 1000);
          const payload = Buffer.from(JSON.stringify({ v: 1, sub: 'anon_' + 'a'.repeat(24), mode: 'anonymous-opt-in', consent: true, method: 'POST', path: '/api/sonic/events', iat: now, exp: now + 30 })).toString('base64url');
          const signature = createHmac('sha256', process.env.IDENTITY_SECRET).update('sonic-engine-identity-v1.' + payload).digest('base64url');
          const response = await fetch('http://127.0.0.1:18081/api/sonic/events', {
            method: 'POST',
            headers: { 'X-Sonic-Engine-Key': process.env.ENGINE_SECRET, 'X-Sonic-Verified-Identity': `${payload}.${signature}`, 'X-Sonic-Identity-Required': '1', 'Content-Type': 'application/json' },
            body: JSON.stringify({ events: [{ type: 'search', query: 'ci-persistence-smoke', eventId: 'ci-persistence-smoke' }] }),
          });
          assert.equal(response.status, 200);
          assert.equal((await response.json()).data.accepted, 1);
          NODE

          docker exec "$NAME" node --experimental-sqlite scripts/backup-recommend-db.mjs \
            /app/data/sonic-recommend.sqlite /app/data/ci-backup.sqlite > /tmp/sonic-backup.json
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const b=JSON.parse(fs.readFileSync("/tmp/sonic-backup.json","utf8")); assert.equal(b.ok,true); assert.equal(b.events,1); assert.match(b.sha256,/^[a-f0-9]{64}$/);'
          # A live WAL database must be rejected even with the explicit offline acknowledgement.
          if docker exec "$NAME" node --experimental-sqlite scripts/restore-recommend-db.mjs \
            /app/data/ci-backup.sqlite /app/data/sonic-recommend.sqlite --offline > /tmp/sonic-live-restore.log 2>&1; then
            printf '%s\n' 'Restore unexpectedly accepted an active database' >&2
            exit 1
          fi
          grep -q 'active or uncheckpointed database' /tmp/sonic-live-restore.log
          docker stop --time 75 "$NAME" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$NAME")" = "0"
          docker rm "$NAME" >/dev/null
          docker run --rm --entrypoint node -v "$VOLUME":/app/data sonic-ci:${{ github.sha }} \
            --experimental-sqlite scripts/restore-recommend-db.mjs \
            /app/data/ci-backup.sqlite /app/data/sonic-recommend.sqlite --offline > /tmp/sonic-restore.json
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const r=JSON.parse(fs.readFileSync("/tmp/sonic-restore.json","utf8")); assert.equal(r.ok,true); assert.equal(r.events,1); assert.ok(r.preRestoreSafetyCopy);'
          docker run -d --name "$NAME" --stop-timeout 75 \
            -e SONIC_ENGINE_SECRET="$ENGINE_SECRET" \
            -e SONIC_SECRET="$AUTH_SECRET" \
            -e SONIC_ENGINE_IDENTITY_SECRET="$IDENTITY_SECRET" \
            -e SONIC_RUNTIME=linux-engine \
            -e SONIC_ENV=production \
            -e SONIC_REQUIRE_RELEASE_METADATA=1 \
            -e SONIC_CONTENT_POLICY=strict-allowlist \
            -e SONIC_ALLOWED_SOURCES=netease,qq,kugou,kuwo,amll,lrclib \
            -v "$VOLUME":/app/data \
            -p 18081:8080 \
            sonic-ci:${{ github.sha }}
          wait_ready
          grep -q '"eventCount":1' /tmp/sonic-health.json
          docker logs "$NAME"

  browser-e2e:
    name: Browser E2E (mocked gateway, real media element)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm --version

      - name: Install root dependencies (lockfile)
        run: npm ci

      - name: Install player dependencies (lockfile)
        run: pnpm --dir player install --frozen-lockfile

      - name: Build frontend for E2E
        run: pnpm --dir player build

      - name: Install Playwright Chromium
        run: pnpm --dir player exec playwright install --with-deps chromium

      # e2e/mock-server.mjs 提供确定性 /api Mock 与本地生成的 20s WAV；
      # 本作业验证前端行为，不代表真实 CDN/OAuth/上游音源已验收。
      - name: Run browser E2E
        run: pnpm --dir player exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            player/e2e-report
            player/e2e-results
          retention-days: 7
