name: security-ci

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install player dependencies
        run: pnpm --dir player install --frozen-lockfile

      - name: Typecheck backend
        run: pnpm typecheck

      - name: Security and gateway tests
        run: pnpm test

      - name: Player unit tests
        run: pnpm --dir player test

      - name: Build frontend and engine
        run: pnpm build && pnpm build:engine

      - name: Build Docker image
        run: docker build -t sonic-ci .
