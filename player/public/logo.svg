<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Stage Gradient -->
    <radialGradient id="stageBg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#141E34" />
      <stop offset="45%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#030509" />
    </radialGradient>

    <!-- Sonic Primary Stream: Electric Cyan to Hyper Blue -->
    <linearGradient id="sonicCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="30%" stop-color="#00D2FF" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Sonic Harmonic Stream: Cosmic Violet to Radiant Sky -->
    <linearGradient id="sonicVioletSky" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>

    <!-- Rim Light for Glass Squircle -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glass Specular Sheen -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Central Interlocking Shadow (3D Möbius Occlusion) -->
    <filter id="ribbonOcclusion" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.9" />
    </filter>

    <!-- High Frequency Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.6" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Modern Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#stageBg)" stroke="url(#rimLight)" stroke-width="2.2" />
  <rect x="26" y="26" width="460" height="230" rx="116" fill="url(#glassGloss)" />

  <!-- Ambient Sound Field & Sonic Radar Orbit -->
  <g opacity="0.4">
    <!-- Concentric Acoustic Wave Circles -->
    <circle cx="256" cy="256" r="198" stroke="url(#sonicCyanBlue)" stroke-width="1.2" stroke-dasharray="3 9" opacity="0.5" />
    <circle cx="256" cy="256" r="168" stroke="url(#sonicVioletSky)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6" />
    
    <!-- Stereo Acoustic Frequency Equalizer Impulses (Subtle Soundfield Wings) -->
    <!-- Left Channel (Bass to Mid) -->
    <line x1="72" y1="236" x2="72" y2="276" stroke="#00F5FF" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="86" y1="216" x2="86" y2="296" stroke="#00F5FF" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <line x1="100" y1="200" x2="100" y2="312" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="114" y1="224" x2="114" y2="288" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Right Channel (Mid to Treble) -->
    <line x1="440" y1="236" x2="440" y2="276" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="426" y1="216" x2="426" y2="296" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <line x1="412" y1="200" x2="412" y2="312" stroke="#6366F1" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="398" y1="224" x2="398" y2="288" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Core Dynamic Sonic Waveform Monogram "S" -->
  <g>
    <!-- LOWER / BACK HARMONIC WAVE (Flows through center up to top-right) -->
    <path d="M 160 380 
             C 216 432 308 432 352 386 
             C 388 348 386 294 330 252 
             L 242 186 
             C 204 156 186 130 196 98 
             C 208 62 264 52 320 68 
             C 346 76 372 90 392 108" 
          stroke="url(#sonicVioletSky)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95" />

    <!-- FOREGROUND SHADOW OCCLUSION (Giving 3D Möbius Layering) -->
    <path d="M 352 132 
             C 296 80 204 80 160 126 
             C 124 164 126 218 182 260 
             L 270 326 
             C 308 356 326 382 316 414 
             C 304 450 248 460 192 444 
             C 166 436 140 422 120 404" 
          stroke="#050811" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" filter="url(#ribbonOcclusion)" />

    <!-- UPPER / FOREGROUND SUPERSONIC WAVE (Sweeps with immense kinetic speed) -->
    <path d="M 352 132 
             C 296 80 204 80 160 126 
             C 124 164 126 218 182 260 
             L 270 326 
             C 308 356 326 382 316 414 
             C 304 450 248 460 192 444 
             C 166 436 140 422 120 404" 
          stroke="url(#sonicCyanBlue)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- INNER SPEED HIGHLIGHT (The supersonic aerodynamic shockline) -->
    <path d="M 334 116 C 290 82 220 86 178 122 C 148 148 144 190 188 226 L 254 278" 
          stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <path d="M 178 396 C 222 430 292 426 334 390 C 364 364 368 322 324 286 L 258 234" 
          stroke="#00F5FF" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />

    <!-- ACOUSTIC SINGULARITY NODES (High Energy Focal Points) -->
    <!-- Top Leading Node -->
    <circle cx="352" cy="132" r="8" fill="#00F5FF" filter="url(#neonGlow)" />
    <circle cx="352" cy="132" r="3.5" fill="#FFFFFF" />

    <!-- Bottom Trailing Node -->
    <circle cx="160" cy="380" r="8" fill="#8B5CF6" filter="url(#neonGlow)" />
    <circle cx="160" cy="380" r="3.5" fill="#FFFFFF" />

    <!-- Center Super-Resonance Fulcrum -->
    <circle cx="256" cy="256" r="5" fill="#FFFFFF" filter="url(#neonGlow)" />
    <circle cx="256" cy="256" r="2.5" fill="#00F5FF" />
  </g>
</svg>
